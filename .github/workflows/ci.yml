name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate shell and Python
        run: |
          bash -n tools/ctl.sh
          bash -n run.sh
          python3 -m py_compile tools/reproctl.py tools/generate_rule_signal.py
          python3 tools/reproctl.py validate
      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -v
          for suite in reproducers/*/tests; do
            [ -d "$suite" ] && (cd "${suite%/tests}" && python3 -m unittest discover -s tests -v)
          done
      - name: Scan tracked artifacts
        run: python3 reproducers/rrc-signaling-storm/analysis/check_sensitive_artifacts.py
