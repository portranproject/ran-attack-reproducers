cu_cp:
  max_nof_ues: 90
  amf: { addrs: 10.53.1.2, port: 38412, bind_addrs: 10.53.1.1,
         supported_tracking_areas: [ { tac: 7, plmn_list: [ { plmn: "00101", tai_slice_support_list: [ { sst: 1 } ] } ] } ] }
  f1ap: { bind_addrs: 172.31.5.10 }        # F1-C: CU 사설IP
  inactivity_timer: 7200                     # 유휴 UE 해제 방지(기본 120s→최대 7200s)

cu_up: { f1u: { socket: [ { bind_addr: 172.31.5.10 } ] } }   # F1-U(GTP-U)

log: { filename: /tmp/ocu.log, all_level: debug, hex_max_size: 32 }
