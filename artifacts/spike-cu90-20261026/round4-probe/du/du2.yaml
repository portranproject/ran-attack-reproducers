f1ap: { addrs: 172.31.5.10, bind_addrs: 172.31.5.11 }   # F1-C: CU 사설 / DU 사설
f1u:  { socket: [ { bind_addr: 172.31.5.11 } ], bind_port: 2153, peer_port: 2152 }          # ★F1-U(GTP-U) 바인드 = DU 사설 (없으면 127.0.10.2 루프백→데이터 0)
ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:4558,rx_port=tcp://127.0.0.1:4559,base_srate=23.04e6
  srate: 23.04
  tx_gain: -12
  rx_gain: 0
cell_cfg:
  pci: 2
  sector_id: 1
  dl_arfcn: 632628
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00101"
  tac: 7
  pusch: { dmrs_additional_position: 2 }
log: { filename: /tmp/odu2.log, all_level: debug, phy_level: info, hex_max_size: 32, e2ap_level: debug }
e2:
  enable_du_e2: true
  addrs: 172.31.5.10
  bind_addrs: 172.31.5.11
  port: 36421
  e2sm_kpm_enabled: true
